name: Monorepo checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # PostgreSQL is existing shared infrastructure reachable from this runner.
    runs-on: [self-hosted, linux, enterprise-gateway]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - name: Load existing shared PostgreSQL service configuration
        env:
          GATEWAY_PG_CONFIG_JSON: ${{ secrets.GATEWAY_PG_CONFIG_JSON }}
          GATEWAY_PG_CONFIG_FILE: ${{ runner.temp }}/gateway-ci-pg.json
        run: |
          python - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ['GATEWAY_PG_CONFIG_JSON'])
          path = Path(os.environ['GATEWAY_PG_CONFIG_FILE'])
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w') as output:
              json.dump(config, output)
          path.chmod(0o600)
          PYCONFIG
      - uses: actions/cache@v4
        with:
          path: apps/backend/models
          key: ner-${{ runner.os }}-5d660ed2aa9da482-${{ hashFiles('apps/backend/uv.lock', 'apps/backend/scripts/ner/*.py') }}
      - name: Prepare pinned local model package
        working-directory: apps/backend
        env:
          GATEWAY_NER_DOWNLOAD_BASE: https://huggingface.co
        run: |
          uv run --frozen --offline --no-editable --group dev --cache-dir .uv-cache python scripts/ner/fetch_model.py
          uv run --frozen --offline --no-editable --group dev --cache-dir .uv-cache python scripts/ner/export_onnx.py
      - name: Frontend dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Linux aggregate verification
        env:
          GATEWAY_TEST_PG_CONFIG: ${{ runner.temp }}/gateway-ci-pg.json
          GATEWAY_HISTORY_PG_CONFIG: ${{ runner.temp }}/gateway-ci-pg.json
          GATEWAY_CHECK_BROWSER: '1'
          GATEWAY_TEST_TIMEOUT_SECONDS: '1800'
        run: bash scripts/check.sh
      - name: Build context, TypeScript failure gates and images
        run: |
          python scripts/check_docker_context.py
          python scripts/check_typecheck.py
          docker build -f apps/admin-web/Dockerfile -t enterprise-admin-web:local .
          docker build -f apps/backend/Dockerfile -t enterprise-privacy-gateway:local apps/backend
          python scripts/check_images.py
          python scripts/check_proxy.py
      - name: Browser through Nginx
        env:
          GATEWAY_HISTORY_PG_CONFIG: ${{ runner.temp }}/gateway-ci-pg.json
        run: python scripts/run_nginx_e2e.py
      - name: Remove temporary connection configuration
        if: always()
        env:
          GATEWAY_PG_CONFIG_FILE: ${{ runner.temp }}/gateway-ci-pg.json
        run: python -c 'import os; from pathlib import Path; Path(os.environ["GATEWAY_PG_CONFIG_FILE"]).unlink(missing_ok=True)'
