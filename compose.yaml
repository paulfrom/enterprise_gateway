services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-privacy-gateway:latest
    container_name: enterprise-privacy-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
    volumes:
      # 持久化审计证据与加密 Spool
      - ./runtime_state:/app/.runtime_state
      # 可选：直接挂载自定义的多供应商配置文件
      - ./config/providers.json:/app/config/providers.json:ro
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4096m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
