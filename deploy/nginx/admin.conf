server {
    listen 80;
    server_name localhost;
    client_max_body_size 1m;
    error_page 413 = @api_413_error;
    error_page 404 = @not_found;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets exact handling
    location /assets/ {
        try_files $uri =404;
    }

    # Prohibited legacy & internal routes (error domain isolation)
    location /history {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    location /healthz {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    location /readyz {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    # API error domain isolation: non-admin /api/ calls return JSON 404, never SPA HTML
    location = /api {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    # Reverse proxy for admin management API
    location /api/admin/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 2s;

        # Keep JSON semantics for upstream connection failures
        error_page 413 = @api_413_error;
        error_page 502 = @api_502_error;
        error_page 504 = @api_504_error;
    }

    # Model API whitelist: only allowed endpoints are forwarded
    location = /v1/chat/completions {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 2s;

        error_page 413 = @api_413_error;
        error_page 502 = @api_502_error;
        error_page 504 = @api_504_error;
    }

    location = /v1/messages {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 2s;

        error_page 413 = @api_413_error;
        error_page 502 = @api_502_error;
        error_page 504 = @api_504_error;
    }

    # Non-whitelisted /v1 calls return JSON 404, never SPA HTML
    location = /v1 {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    location /v1/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    location @api_413_error {
        default_type application/json;
        return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"Request body exceeds limit"}}';
    }

    # Upstream gateway error handlers in JSON format
    location @api_502_error {
        default_type application/json;
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"Backend service unavailable"}}';
    }

    location @api_504_error {
        default_type application/json;
        return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Gateway timeout"}}';
    }

    location @not_found {
        types { }
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found"}}';
    }

    # React owns the three supported page routes. Missing files never become HTML 200.
    location = / { return 302 /login; }
    location = /login { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /admin/requests { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
